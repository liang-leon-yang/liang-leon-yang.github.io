  "about": {
    "en": [
      "I am a PhD candidate in Management Science and Engineering at the School of Management, Beijing Institute of Technology, specializing in Management Information Systems. My research examines how artificial intelligence can understand human needs and support decisions in digital health and online information systems. I focus on three related questions: how conversational systems can recognize emotions and implicit social support needs and generate empathetic responses; how health risk models can make disease and readmission predictions more interpretable; and how structured knowledge and multimodal evidence can help identify mental health misinformation. Across these areas, I study how information is represented and used in intelligent systems, and how their predictions, explanations, and responses relate to the needs of the people they support.",
      "My work combines emotional intelligence and multi-agent reinforcement learning for dialogue, answer-informed contrastive learning for support-need inference, LLM-guided Bayesian structure learning and imbalance-aware modeling for health risk assessment, and knowledge graphs with multimodal learning for misinformation detection. I also study digital therapeutics in disease self-management and how online mental health communities respond to help-seeking. My publications include articles in Knowledge-Based Systems, Decision Support Systems, Expert Systems with Applications, Technology in Society, and Information Processing & Management, together with papers in the ICIS and PACIS proceedings. Two further manuscripts, on empathetic dialogue generation and implicit social support needs, are under major revision at Management Science and MIS Quarterly, respectively. The Research page presents these published and ongoing studies with their current publication status."
    ],
    "zh": [
      "我是北京理工大学管理学院管理科学与工程专业的博士研究生，研究方向为管理信息系统。我的研究围绕数字健康与在线信息系统展开，关注人工智能如何理解人的需求，并为健康相关的判断与交流提供支持。具体而言，我研究心理健康对话中的情绪识别、隐含社会支持需求与共情回应，探索疾病及再入院风险预测的可解释建模方法，并利用结构化知识与多模态证据识别社交媒体中的心理健康错误信息。这些研究从需求理解、风险解释和信息求证三个角度，考察智能系统如何组织和使用信息，以及模型的预测、解释与回应如何联系到人的实际需求。",
      "在方法上，我将情绪智能与多智能体强化学习用于共情对话，将回答信息增强的对比学习用于支持需求识别，结合大语言模型引导的贝叶斯结构学习与不平衡学习开展健康风险建模，并利用知识图谱和多模态学习进行错误信息检测。此外，我也关注数字疗法在疾病自我管理中的应用，以及在线心理健康社区如何回应求助。相关成果发表于 Knowledge-Based Systems、Decision Support Systems、Expert Systems with Applications、Technology in Society、Information Processing & Management 等期刊及 ICIS、PACIS 会议；关于共情对话生成与隐含社会支持需求识别的两篇论文，分别在 Management Science 和 MIS Quarterly 大修中。研究成果页按发表状态列出了这些已发表与进行中的研究。"
    ]
  }
