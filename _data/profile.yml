  },
  "bio": {
    "en": "I am a PhD candidate in Management Science and Engineering at the School of Management, Beijing Institute of Technology. My research specialization is Management Information Systems.",
    "zh": "我目前是北京理工大学管理学院管理科学与工程专业博士研究生，研究方向为管理信息系统。"
