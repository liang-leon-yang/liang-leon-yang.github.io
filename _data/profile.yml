    {
      "id": "empathy",
      "group": "review",
      "title": "AI-enabled Empathetic Dialogue Generation: An Emotional Intelligence-enhanced Multi-agent Reinforcement Learning Approach",
      "authors": "Yang, L., Xie, J., Yin, Q., & Yan, Z.",
      "venue": "Management Science",
      "year": "",
      "detail": {
        "en": "Major revision · Round 1",
        "zh": "大修 · 第一轮"
      },
      "selected": true,
      "role": {
        "en": "",
        "zh": ""
      },
      "overview": {
        "en": "This study develops EID-MARL, a dialogue model that makes the choice of an empathetic response strategy explicit. Specialized agents exchange emotional information through a learned communication structure, while an expectation-maximization method assigns feedback to individual communication links. Evaluations using automated assessments and medical expert reviews examine response quality, robustness, and generalization.",
        "zh": "本研究提出 EID-MARL 共情对话模型，将回应策略的选择显式纳入对话生成过程。不同智能体通过可学习的通信结构交换情绪信息，并利用期望最大化方法将反馈分配到具体的智能体通信连接。研究结合自动化评估与医学专家评价，考察生成回应的质量、鲁棒性和泛化能力。"
      },
      "citation": {
        "title": "AI-enabled empathetic dialogue generation: An emotional intelligence-enhanced multi-agent reinforcement learning approach"
      },
      "reference_sort": "yang, l., xie, j., yin, q., & yan, z.  ai-enabled empathetic dialogue generation: an emotional intelligence-enhanced multi-agent reinforcement learning approach"
    },
    {
      "id": "support",
      "group": "review",
      "title": "Simulating a Pseudo-Answer to Infer Implicit Social Support Needs in New Questions: A Gold-Answer Guided Attentive Contrastive Learning Approach",
      "authors": "Kuang, J.*, Yang, L.*, Cui, S., & Fan, W.",
      "venue": "MIS Quarterly",
      "year": "",
      "detail": {
        "en": "Major revision · Round 2",
        "zh": "大修 · 第二轮"
      },
      "selected": true,
      "role": {
        "en": "Co-first author",
        "zh": "共同第一作者"
      },
      "overview": {
        "en": "This study focuses on the implicit social support needs expressed in newly posted questions. It simulates a possible answer and uses gold-answer guided attentive contrastive learning to infer those needs. The approach explores how answer-side information can help interpret a question when an actual response is not yet available.",
        "zh": "本研究关注新发布问题中隐含的社会支持需求，通过模拟可能的回答，并结合标准回答引导的注意力对比学习，推断提问者的需求。其核心思路是在真实回答尚未出现时，利用模拟回答所提供的信息辅助理解问题。"
      },
      "citation": {
        "title": "Simulating a pseudo-answer to infer implicit social support needs in new questions: A gold-answer guided attentive contrastive learning approach"
      },
