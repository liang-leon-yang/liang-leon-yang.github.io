      "question": {
        "en": "I investigate mental health misinformation detection by linking multimodal content to structured knowledge and graph evidence. This work examines knowledge-guided representations and graph-based reasoning for assessing online claims, with attention to the robustness of classification across content and evidence representations.",
        "zh": "针对社交媒体中的心理健康错误信息，研究文本、图像与结构化知识之间的证据关联。结合知识引导的多模态表征与图证据推理，探索利用外部知识支持信息识别，并考察模型对不同内容及证据表达的鲁棒性。"
      },
      "methods": {
        "en": "Knowledge-guided multimodal learning · Graph evidence reasoning",
        "zh": "知识引导的多模态学习 · 图证据推理"
      },
