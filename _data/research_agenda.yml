      "question": {
        "en": "I study disease and readmission risk assessment under class imbalance, with an emphasis on interpretable model structure and prediction explanations. This research integrates LLM-guided Bayesian structure discovery, imbalance-aware learning, and SHAP-based analysis to examine coronary heart disease risk and hospital readmission.",
        "zh": "面向疾病风险与再入院风险评估，研究类别不平衡条件下的预测建模及其解释机制。结合大语言模型引导的贝叶斯网络结构发现、不平衡学习与 SHAP 分析，考察模型结构、风险预测和解释依据之间的联系。"
      },
      "methods": {
