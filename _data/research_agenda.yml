      "question": {
        "en": "I develop computational methods for modeling emotional cues and implicit support needs in mental health conversations. This work combines emotional intelligence, multi-agent reinforcement learning, and answer-informed contrastive learning to study the relationship between help-seeking expressions, support needs, and response strategies.",
        "zh": "围绕心理健康对话中的情绪线索与隐性社会支持需求，研究回应策略选择及需求识别的计算方法。结合情绪智能、多智能体强化学习与回答信息增强的对比学习，建模求助表达、支持需求与共情回应之间的关系。"
      },
