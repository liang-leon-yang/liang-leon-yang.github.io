<li class="news-item">
  <time class="date" datetime="{{ item.date }}">{{ item.date | replace: '-', '.' }}</time>
  <p>{{ item.text[lang] | escape }}</p>
  {% if item.url %}<a class="news-link" href="{{ prefix | append: item.url | relative_url }}" aria-label="{{ t.news_details }}: {{ item.text[lang] | escape }}">{{ t.news_details }} <span aria-hidden="true">↗</span></a>{% endif %}
</li>
